<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spend Analyser</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans pb-12">

    <header class="bg-indigo-600 text-white shadow-md p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight">Spend Analyser</h1>
            <div class="space-x-2">
                <button onclick="switchTab('dashboard')" class="px-3 py-1.5 rounded-md hover:bg-indigo-700 transition font-medium text-sm">Dashboard</button>
                <button onclick="switchTab('add-spend')" class="px-3 py-1.5 rounded-md hover:bg-indigo-700 transition font-medium text-sm">Log Spend</button>
                <button onclick="switchTab('recurring')" class="px-3 py-1.5 rounded-md hover:bg-indigo-700 transition font-medium text-sm">Recurring</button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 mt-4">
        
        <section id="tab-dashboard" class="space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-xs border border-gray-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <p class="text-sm text-gray-500 font-medium uppercase tracking-wider">This Month's Spend</p>
                    <p class="text-3xl font-extrabold text-gray-900 mt-1">₹<span id="stat-current-month">0.00</span></p>
                </div>
                <div class="border-l border-gray-200 pl-4 md:pl-6">
                    <p class="text-sm text-gray-500 font-medium uppercase tracking-wider">vs Last Month</p>
                    <p class="text-lg font-semibold mt-1" id="stat-comparison">Calculated from history...</p>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-xs border border-gray-100">
                <h3 class="text-md font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-indigo-600"></span> Recurring Obligations
                </h3>
                <div id="recurring-widget-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-2xl shadow-xs border border-gray-100">
                    <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-4">Sector Breakdown (Pie Chart)</h3>
                    <div class="relative max-w-[300px] mx-auto">
                        <canvas id="pieChart"></canvas>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-xs border border-gray-100">
                    <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-4">Daily Velocity (Bar Chart)</h3>
                    <div>
                        <canvas id="barChart"></canvas>
                    </div>
                </div>
            </div>
        </section>

        <section id="tab-add-spend" class="hidden max-w-xl mx-auto bg-white p-6 rounded-2xl shadow-xs border border-gray-100 space-y-4">
            <h2 class="text-lg font-bold text-gray-900 border-b pb-2">Log Daily Transaction</h2>
            <form id="spend-form" onsubmit="handleSpendSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Link Recurring Obligation (Optional)</label>
                    <select id="form-spend-uid" onchange="populateFromRecurring(this.value)" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-hidden">
                        <option value="">-- No Linked Obligation --</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Date</label>
                        <input type="date" id="form-spend-date" required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-hidden">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Time</label>
                        <input type="time" id="form-spend-time" required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-hidden">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Spend Amount (Rupees)</label>
                    <input type="number" id="form-spend-amount" step="any" required min="0.01" placeholder="₹0.00" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-lg font-bold focus:ring-2 focus:ring-indigo-500 focus:outline-hidden">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Category / Sector</label>
                        <select id="form-spend-category" required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-hidden">
                            <option value="Electricity Bill">Electricity Bill</option>
                            <option value="Credit Card Bill">Credit Card Bill</option>
                            <option value="Mobile Recharge">Mobile Recharge</option>
                            <option value="Grocery">Grocery</option>
                            <option value="Online Purchase">Online Purchase</option>
                            <option value="Fruits">Fruits</option>
                            <option value="Loan EMI">Loan EMI</option>
                            <option value="Wifi Bill">Wifi Bill</option>
                            <option value="Petrol">Petrol</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Transaction Mode</label>
                        <select id="form-spend-mode" required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-hidden">
                            <option value="UPI">UPI</option>
                            <option value="Cash">Cash</option>
                            <option value="Credit Card">Credit Card</option>
                            <option value="Net Banking">Net Banking</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Where Spent / Vendor</label>
                    <input type="text" id="form-spend-where" placeholder="Store name, provider, etc." class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-hidden">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Remarks</label>
                    <textarea id="form-spend-remarks" rows="2" placeholder="Notes..." class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-hidden"></textarea>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white rounded-lg p-3 font-bold hover:bg-indigo-700 shadow-md transition cursor-pointer">Save Transaction</button>
            </form>
        </section>

        <section id="tab-recurring" class="hidden space-y-6">
            <div class="max-w-xl mx-auto bg-white p-6 rounded-2xl shadow-xs border border-gray-100 space-y-4">
                <h2 class="text-lg font-bold text-gray-900 border-b pb-2">Manage Recurring Profiles</h2>
                <form id="recurring-form" onsubmit="handleRecurringSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Unique Identifier (UID)</label>
                        <input type="text" id="form-rec-uid" required placeholder="e.g., LoanSBI, Wifi Bill" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-hidden">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Category</label>
                            <select id="form-rec-category" required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-hidden">
                                <option value="Electricity Bill">Electricity Bill</option>
                                <option value="Mobile Recharge">Mobile Recharge</option>
                                <option value="Grocery">Grocery</option>
                                <option value="Online Purchase">Online Purchase</option>
                                <option value="Fruits">Fruits</option>
                                <option value="Loan EMI">Loan EMI</option>
                                <option value="Wifi Bill">Wifi Bill</option>
                                <option value="Others">Others</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Default Base Amount (₹)</label>
                            <input type="number" id="form-rec-amount" step="any" required min="0" placeholder="0.00" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-hidden">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Expected Monthly Due Date</label>
                        <input type="date" id="form-rec-duedate" required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-hidden">
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 text-white rounded-lg p-3 font-bold hover:bg-emerald-700 shadow-md transition cursor-pointer">Register Profile</button>
                </form>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-xs border border-gray-100">
                <h3 class="text-md font-bold text-gray-800 mb-4">Active System Configurations</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-gray-200 text-xs font-semibold uppercase text-gray-400 bg-gray-50">
                                <th class="p-3">UID Anchor</th>
                                <th class="p-3">Category</th>
                                <th class="p-3">Default Base</th>
                                <th class="p-3">Target Due</th>
                                <th class="p-3 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="recurring-table-body" class="text-sm divide-y divide-gray-100">
                            </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <script>
        let db;
        let pieChartInstance = null;
        let barChartInstance = null;

        // Initialize IndexedDB Browser Engine
        function initDatabase() {
            const request = indexedDB.open("SpendAnalyserDB", 1);
            
            request.onupgradeneeded = function(event) {
                const database = event.target.result;
                // Core transactional ledger store
                if (!database.objectStoreNames.contains("spends")) {
                    database.createObjectStore("spends", { keyPath: "id", autoIncrement: true });
                }
                // Structural relational tracking configuration store
                if (!database.objectStoreNames.contains("recurring")) {
                    database.createObjectStore("recurring", { keyPath: "uid" });
                }
            };

            request.onsuccess = function(event) {
                db = event.target.result;
                setDefaultFormPickers();
                syncUIComponents();
            };
        }

        function setDefaultFormPickers() {
            const now = new Date();
            document.getElementById('form-spend-date').value = now.toISOString().split('T')[0];
            document.getElementById('form-spend-time').value = now.toTimeString().split(' ')[0].slice(0, 5);
            document.getElementById('form-rec-duedate').value = now.toISOString().split('T')[0];
        }

        function switchTab(tabId) {
            ['dashboard', 'add-spend', 'recurring'].forEach(tab => {
                document.getElementById(`tab-${tab}`).classList.add('hidden');
            });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            if(tabId === 'dashboard') syncUIComponents();
        }

        // Write Operations
        function handleSpendSubmit(event) {
            event.preventDefault();
            const transaction = db.transaction(["spends", "recurring"], "readwrite");
            const spendStore = transaction.objectStore("spends");
            const recStore = transaction.objectStore("recurring");

            const uid = document.getElementById('form-spend-uid').value;
            const spendDate = document.getElementById('form-spend-date').value;

            const record = {
                uid: uid || null,
                date: spendDate,
                time: document.getElementById('form-spend-time').value,
                amount: parseFloat(document.getElementById('form-spend-amount').value),
                category: document.getElementById('form-spend-category').value,
                mode: document.getElementById('form-spend-mode').value,
                where: document.getElementById('form-spend-where').value,
                remarks: document.getElementById('form-spend-remarks').value
            };

            spendStore.add(record);

            if (uid) {
                recStore.get(uid).onsuccess = function(e) {
                    const profile = e.target.result;
                    if(profile) {
                        profile.lastPaidDate = spendDate;
                        recStore.put(profile);
                    }
                };
            }

            transaction.oncomplete = function() {
                document.getElementById('spend-form').reset();
                setDefaultFormPickers();
                switchTab('dashboard');
            };
        }

        function handleRecurringSubmit(event) {
            event.preventDefault();
            const transaction = db.transaction(["recurring"], "readwrite");
            const store = transaction.objectStore("recurring");

            const profile = {
                uid: document.getElementById('form-rec-uid').value.trim(),
                category: document.getElementById('form-rec-category').value,
                amount: parseFloat(document.getElementById('form-rec-amount').value),
                dueDate: document.getElementById('form-rec-duedate').value,
                lastPaidDate: null
            };

            store.put(profile);

            transaction.oncomplete = function() {
                document.getElementById('recurring-form').reset();
                setDefaultFormPickers();
                syncUIComponents();
            };
        }

        function deleteRecurring(uid) {
            const transaction = db.transaction(["recurring"], "readwrite");
            transaction.objectStore("recurring").delete(uid);
            transaction.oncomplete = function() {
                syncUIComponents();
            };
        }

        function populateFromRecurring(uid) {
            if(!uid) return;
            const transaction = db.transaction(["recurring"], "readonly");
            transaction.objectStore("recurring").get(uid).onsuccess = function(e) {
                const profile = e.target.result;
                if(profile) {
                    document.getElementById('form-spend-amount').value = profile.amount;
                    document.getElementById('form-spend-category').value = profile.category;
                }
            };
        }

        // Analytical Pipelines & UI Rendering
        function syncUIComponents() {
            const transaction = db.transaction(["spends", "recurring"], "readonly");
            const spendStore = transaction.objectStore("spends");
            const recStore = transaction.objectStore("recurring");

            let allSpends = [];
            let allRecurring = [];

            spendStore.getAll().onsuccess = function(e) { allSpends = e.target.result; };
            recStore.getAll().onsuccess = function(e) { 
                allRecurring = e.target.result; 
                renderDashboardMetrics(allSpends, allRecurring);
            };
        }

        function renderDashboardMetrics(spends, recurring) {
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth(); // 0-indexed

            let currentMonthTotal = 0;
            let lastMonthTotal = 0;

            const categoryTotals = {};
            const dailyTotals = {};

            // Parse transactional ledger records
            spends.forEach(item => {
                const itemDate = new Date(item.date);
                const itemYear = itemDate.getFullYear();
                const itemMonth = itemDate.getMonth();

                if (itemYear === currentYear && itemMonth === currentMonth) {
                    currentMonthTotal += item.amount;
                    categoryTotals[item.category] = (categoryTotals[item.category] || 0) + item.amount;
                    
                    const dayLabel = itemDate.getDate();
                    dailyTotals[dayLabel] = (dailyTotals[dayLabel] || 0) + item.amount;
                } else if (itemYear === currentYear && itemMonth === (currentMonth - 1)) {
                    lastMonthTotal += item.amount;
                }
            });

            document.getElementById('stat-current-month').textContent = currentMonthTotal.toFixed(2);
            
            // Render Comparative Analytics
            const compEl = document.getElementById('stat-comparison');
            if (lastMonthTotal > 0) {
                const percentChange = ((currentMonthTotal - lastMonthTotal) / lastMonthTotal) * 180;
                if(percentChange > 0) {
                    compEl.className = "text-sm font-semibold mt-1 text-red-600";
                    compEl.textContent = `+${percentChange.toFixed(1)}% higher than last month (₹${lastMonthTotal.toFixed(2)})`;
                } else {
                    compEl.className = "text-sm font-semibold mt-1 text-emerald-600";
                    compEl.textContent = `${percentChange.toFixed(1)}% lower than last month (₹${lastMonthTotal.toFixed(2)})`;
                }
            } else {
                compEl.className = "text-xs font-medium mt-1 text-gray-400";
                compEl.textContent = "Insufficient baseline historical data.";
            }

            // Sync Dropdown Options in Entry Form
            const spendUidDropdown = document.getElementById('form-spend-uid');
            spendUidDropdown.innerHTML = '<option value="">-- No Linked Obligation --</option>';
            recurring.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.uid;
                opt.textContent = item.uid;
                spendUidDropdown.appendChild(opt);
            });

            // Process State Machine for Recurring Visual Widgets
            const widgetContainer = document.getElementById('recurring-widget-list');
            widgetContainer.innerHTML = '';
            
            const tableBody = document.getElementById('recurring-table-body');
            tableBody.innerHTML = '';

            recurring.forEach(item => {
                let isPaidThisMonth = false;
                if (item.lastPaidDate) {
                    const lDate = new Date(item.lastPaidDate);
                    if(lDate.getFullYear() === currentYear && lDate.getMonth() === currentMonth) {
                        isPaidThisMonth = true;
                    }
                }

                // Render operational dashboard quick-view widget item
                const card = document.createElement('div');
                card.className = `p-4 rounded-xl border flex justify-between items-center ${isPaidThisMonth ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}`;
                card.innerHTML = `
                    <div>
                        <p class="font-bold text-gray-800 text-sm">${item.uid}</p>
                        <p class="text-xs text-gray-500">Expected Base: ₹${item.amount.toFixed(2)}</p>
                    </div>
                    ${isPaidThisMonth 
                        ? '<span class="bg-emerald-600 text-white rounded-full p-1 text-xs font-bold">✓ Paid</span>' 
                        : `<button onclick="triggerQuickPay('${item.uid}')" class="bg-rose-600 hover:bg-rose-700 text-white text-xs px-3 py-1.5 rounded-lg font-medium shadow-xs transition cursor-pointer">Log Payment</button>`
                    }
                `;
                widgetContainer.appendChild(card);

                // Render Administrative Maintenance Settings row
                const row = document.createElement('tr');
                row.className = "hover:bg-gray-50 transition";
                row.innerHTML = `
                    <td class="p-3 font-semibold text-gray-700">${item.uid}</td>
                    <td class="p-3 text-gray-600">${item.category}</td>
                    <td class="p-3 font-medium text-gray-900">₹${item.amount.toFixed(2)}</td>
                    <td class="p-3 text-gray-500">${item.dueDate}</td>
                    <td class="p-3 text-right">
                        <button onclick="deleteRecurring('${item.uid}')" class="text-rose-600 hover:text-rose-900 font-medium text-xs transition cursor-pointer">Delete</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });

            generateCharts(categoryTotals, dailyTotals);
        }

        function triggerQuickPay(uid) {
            switchTab('add-spend');
            document.getElementById('form-spend-uid').value = uid;
            populateFromRecurring(uid);
        }

        function generateCharts(categoryData, dailyData) {
            // Destroy existing charts to reload cleaner frame animations
            if (pieChartInstance) pieChartInstance.destroy();
            if (barChartInstance) barChartInstance.destroy();

            // Pie Chart Rendering Configuration
            const pieCtx = document.getElementById('pieChart').getContext('2d');
            const pieLabels = Object.keys(categoryData);
            const pieValues = Object.values(categoryData);

            pieChartInstance = new Chart(pieCtx, {
                type: 'pie',
                data: {
                    labels: pieLabels,
                    datasets: [{
                        data: pieValues,
                        backgroundColor: ['#4f46e5', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#64748b']
                    }]
                },
                options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
            });

            // Bar Chart Rendering Configuration
            const barCtx = document.getElementById('barChart').getContext('2d');
            const sortedDays = Object.keys(dailyData).sort((a, b) => a - b);
            const barValues = sortedDays.map(day => dailyData[day]);

            barChartInstance = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: sortedDays.map(d => `Day ${d}`),
                    datasets: [{
                        label: 'Spend Level (₹)',
                        data: barValues,
                        backgroundColor: '#4f46e5'
                    }]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true } } }
            });
        }

        // Initialize App Shell Infrastructure
        window.onload = function() {
            initDatabase();
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js');
            }
        };
    </script>
</body>
</html>
